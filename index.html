
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisco Webex Contact Center Live Chat</title>
</head>
<body>

    <!-- Cisco LiveChat Widget Container -->
    <div
        id="divicw"
        data-bind="2ED3426B-004B-4398-BF1A-3236C885F309"
        data-org=""
        data-guid="70b6e67c-7d15-4f35-98b8-83c190672e1b">
    </div>

    <script>
        var i = {

            // Initialize LiveChat
            t: function () {
                try {
                    var e = document.getElementById("divicw");
                    var t = document.createElement("script");

                    t.src =
                        "https://chat-widget.produs1.ciscoccservice.com/js/imichatinit.js?t="
                        + new Date().toISOString();

                    e.insertAdjacentElement("afterend", t);

                    t.addEventListener("load", function () {
                        console.log(
                            new Date().toISOString(),
                            "Livechat script loaded successfully!"
                        );
                    });

                    t.addEventListener("error", function () {
                        console.log(
                            new Date().toISOString(),
                            "Error loading Livechat script"
                        );

                        i.o(e);
                    });

                } catch (e) {
                    console.error(e);
                }
            },

            // Unsupported Browser Fallback
            o: function (e) {

                e.insertAdjacentHTML(
                    "afterend",
                    '<iframe id="tls_al_frm" frameborder="0" ' +
                    'style="overflow:hidden;height:208px;width:394px;' +
                    'position:fixed;display:block;right:48px;bottom:12px;' +
                    'z-index:99999;display:none;"></iframe>'
                );

                var t = document.getElementById("tls_al_frm");
                var n = t.contentWindow;
                var d = n.document;

                d.open();

                d.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <title>Unsupported Browser</title>

                        <style>
                            body {
                                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                                color: #99a0b0;
                                font-size: 14px;
                            }

                            .popover__content {
                                background-color: #fbfbfe;
                                padding: 1.5rem;
                                border-radius: 5px;
                                width: 300px;
                                box-shadow: 0 2px 5px 0 rgba(0,0,0,0.26);
                                position: relative;
                            }

                            .popover__message {
                                font-weight: 600;
                                color: #56627c;
                                font-size: 16px;
                            }

                            .pull-left {
                                float: left;
                            }

                            .clearfix {
                                clear: both;
                            }

                            .hdr-txt {
                                width: 218px;
                                margin-top: 3px;
                            }

                            .para-txt a {
                                text-decoration: none;
                                color: #005cde;
                            }

                            .close-btn {
                                position: absolute;
                                right: 15px;
                                top: 15px;
                            }

                            .close-btn a {
                                text-decoration: none;
                                font-weight: 400;
                                color: #56627c;
                                font-size: 16px;
                            }
                        </style>
                    </head>

                    <body>
                        <div class="popover__content">

                            <div class="close-btn">
                                <a href="#" onclick="closeTLSAlert()">X</a>
                            </div>

                            <div class="popover__message">
                                <div class="pull-left hdr-txt">
                                    This browser version is not supported on LiveChat.
                                </div>
                            </div>

                            <div class="clearfix"></div>

                            <p class="para-txt">
                                Please update your browser to the latest version
                                and re-open the website to access the widget.
                            </p>

                        </div>

                        <script>
                            function closeTLSAlert() {
                                window.parent.postMessage({
                                    key: 'close_tls_alert',
                                    value: 'close_tls_alert',
                                    action: 'close_tls_alert'
                                }, '*');
                            }
                        <\/script>

                    </body>
                    </html>
                `);

                d.close();

                t.style.display = 'block';

                window.addEventListener('message', function (e) {
                    if (e.data.action === 'close_tls_alert') {
                        i.s();
                    }
                });
            },

            // Remove Fallback Alert
            s: function () {
                var e = document.getElementById('tls_al_frm');

                if (e) {
                    e.remove();
                }
            }
        };

        // Start LiveChat
        i.t();

    </script>

</body>
</html>
