<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cisco Webex Contact Center LiveChat Demo</title>
</head>
<body>

    <!-- Cisco Webex Contact Center LiveChat widget container -->
    <div
        id="divicw"
        data-bind="2ED3426B-004B-4398-BF1A-3236C885F309"
        data-org=""
        data-guid="70b6e67c-7d15-4f35-98b8-83c190672e1b">
    </div>

    <script>
        const liveChat = {
            // Load the Cisco LiveChat initialization script.
            initialize: function () {
                try {
                    const container = document.getElementById("divicw");
                    const script = document.createElement("script");

                    script.src =
                        "https://chat-widget.produs1.ciscoccservice.com/js/imichatinit.js?t=" +
                        new Date().toISOString();

                    container.insertAdjacentElement("afterend", script);

                    script.addEventListener("load", function () {
                        console.log(
                            new Date().toISOString(),
                            "LiveChat script loaded successfully."
                        );
                    });

                    script.addEventListener("error", function () {
                        console.error(
                            new Date().toISOString(),
                            "Error loading the LiveChat script."
                        );
                        liveChat.showUnsupportedBrowserMessage(container);
                    });
                } catch (error) {
                    console.error("LiveChat initialization error:", error);
                }
            },

            // Display the fallback message if the external script cannot load.
            showUnsupportedBrowserMessage: function (container) {
                // Avoid creating duplicate fallback iframes.
                if (document.getElementById("tls_al_frm")) {
                    return;
                }

                container.insertAdjacentHTML(
                    "afterend",
                    '<iframe id="tls_al_frm" title="LiveChat browser compatibility message" ' +
                    'frameborder="0" style="overflow:hidden;height:208px;width:394px;' +
                    'position:fixed;right:48px;bottom:12px;z-index:99999;display:none;"></iframe>'
                );

                const frame = document.getElementById("tls_al_frm");
                const frameDocument = frame.contentWindow.document;

                frameDocument.open();
                frameDocument.write(`
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>Unsupported Browser</title>
                        <style>
                            body {
                                font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
                                color: #99a0b0;
                                font-size: 14px;
                                margin: 0;
                            }

                            .popover__content {
                                box-sizing: border-box;
                                background-color: #fbfbfe;
                                padding: 1.5rem;
                                border-radius: 5px;
                                width: 100%;
                                min-height: 208px;
                                box-shadow: 0 2px 5px 0 rgba(0, 0, 0, 0.26);
                                position: relative;
                            }

                            .popover__message {
                                font-weight: 600;
                                color: #56627c;
                                font-size: 16px;
                            }

                            .hdr-txt {
                                width: 218px;
                                margin-top: 3px;
                            }

                            .clearfix {
                                clear: both;
                            }

                            .para-txt a {
                                text-decoration: none;
                                color: #005cde;
                            }

                            .close-btn {
                                position: absolute;
                                right: 15px;
                                top: 15px;
                            }

                            .close-btn a {
                                text-decoration: none;
                                font-weight: 400;
                                color: #56627c;
                                font-size: 16px;
                            }
                        </style>
                    </head>
                    <body>
                        <div class="popover__content">
                            <div class="close-btn">
                                <a href="#" onclick="closeTLSAlert(); return false;" aria-label="Close">X</a>
                            </div>

                            <div class="popover__message">
                                <div class="hdr-txt">
                                    This browser version is not supported on LiveChat.
                                </div>
                            </div>

                            <div class="clearfix"></div>

                            <p class="para-txt">
                                Please update your browser to the latest version
                                and re-open the website to access the widget.
                            </p>
                        </div>

                        <script>
                            function closeTLSAlert() {
                                window.parent.postMessage({
                                    key: "close_tls_alert",
                                    value: "close_tls_alert",
                                    action: "close_tls_alert"
                                }, "*");
                            }
                        <\/script>
                    </body>
                    </html>
                `);
                frameDocument.close();

                frame.style.display = "block";

                // Listen only for the close message from this fallback iframe.
                window.addEventListener("message", function (event) {
                    if (
                        event.source === frame.contentWindow &&
                        event.data &&
                        event.data.action === "close_tls_alert"
                    ) {
                        liveChat.removeFallbackMessage();
                    }
                }, { once: true });
            },

            // Remove the fallback iframe.
            removeFallbackMessage: function () {
                const frame = document.getElementById("tls_al_frm");
                if (frame) {
                    frame.remove();
                }
            }
        };

        // Start the LiveChat integration.
        liveChat.initialize();
    </script>

</body>
</html>
